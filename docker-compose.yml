services:
  db:
    image: postgis/postgis:16-3.4
    container_name: geofabric-db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geofabric}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geofabric}
      POSTGRES_DB: ${POSTGRES_DB:-geofabric}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geofabric}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
